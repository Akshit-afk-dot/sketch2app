[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s2a"
version = "0.1.0"
description = "Sketch2App ML: UI spec tools, data pipeline, stroke recognizer, layout LLM tooling, LAN server"
requires-python = ">=3.12"
# torch is installed separately from the CUDA index (see CLAUDE.md), so it is not listed here.
dependencies = [
    "numpy==2.5.3",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "apted==1.0.3",
    "flask==3.1.3",
    "onnx==1.23.2",
    "onnxscript==0.7.2",
    "onnxruntime==1.28.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "types-PyYAML==6.0.12.20260906", "types-jsonschema==4.26.0.20261006"]

[tool.setuptools.packages.find]
include = ["s2a*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
