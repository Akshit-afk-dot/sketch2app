# 4 GB heap (template default 8 GB) leaves room on a 15 GB laptop.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches break when the project and the Pub cache sit on different drives
# (we build on D: to keep C: free; plugin sources stay in the C: Pub cache).
kotlin.incremental=false
