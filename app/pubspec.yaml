name: sketch2app
description: "Sketch app screens, get a working Flutter app, fully offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: 3.44.0

# Exact pins (see PROGRESS.md "Pinned dependency plan"); pubspec.lock is committed.
dependencies:
  flutter:
    sdk: flutter
  archive: 4.3.0
  flutter_edge_ai: 2.1.1
  flutter_edge_ai_litertlm: 1.11.0
  flutter_onnxruntime: 1.9.0
  google_mlkit_digital_ink_recognition: 0.16.1
  http: 1.6.0
  path_provider: 2.1.6
  share_plus: 13.3.1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/selftest/
    - assets/collect/
